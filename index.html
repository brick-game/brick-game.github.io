<style>
:root{--bg:#F2E9DB;--surface:#FAF4E8;--fg:#2B1A12;--muted:#76604F;--line:#D8C9B2;--brick:#AE4826;--brick-ink:#FBF1E2;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#1F1511;--surface:#2B1E18;--fg:#F2E6D6;--muted:#B39C88;--line:#46342A;--brick:#C85A35;--brick-ink:#FFF4E6}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{width:100%;max-width:420px;text-align:center}
img.logo{width:72px;height:72px;border-radius:16px;display:block;margin:0 auto 16px}
h1{font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
p.sub{color:var(--muted);margin:0 0 28px;font-size:16px}
a.card{display:block;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;color:inherit;text-decoration:none}
a.card:active,a.card:hover{border-color:var(--brick)}
a.card b{display:block;font-size:20px;color:var(--brick);margin-bottom:4px}
a.card span{color:var(--muted);font-size:15px;line-height:1.4}
</style>
</head>
